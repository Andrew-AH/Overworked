name: Release

# Push a tag like v0.7.0 (after bumping <Version> in Directory.Build.props) to build Overworked.exe and the Mac .dmg
# and attach them to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/Overworked.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish/win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: publish/win/Overworked.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: bash mac/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: publish/mac/Overworked-*.dmg

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes Overworked.exe Overworked-*.dmg
        env:
          GH_TOKEN: ${{ github.token }}
